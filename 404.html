<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seite nicht gefunden – Christian Lacina</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Symbol im Browser-Tab und auf dem iOS-Homescreen; erzeugt von tools/favicon.py -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <style>
    /* Gelasio (SIL OFL 1.1, fonts/OFL.txt): Ersatz fuer Georgia, wo sie fehlt
       (Android, Linux). Steht in jeder Liste hinter Georgia; der Browser laedt die
       Datei nur, wenn Georgia nicht installiert ist. */
    @font-face {
      font-family: "Gelasio";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/fonts/gelasio-latin-400-normal.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: "Gelasio";
      font-style: italic;
      font-weight: 400;
      font-display: swap;
      src: url("/fonts/gelasio-latin-400-italic.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: "Gelasio";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("/fonts/gelasio-latin-700-normal.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    /* Farben und Typografie wie in index.html — bewusst nur die noetigen Werte,
       diese Seite kommt ohne Navigation und ohne Sprachumschalter aus. */
    :root {
      --bg: #f6f3ed;
      --text: #2f2c28;
      --muted: #6c675f;
      --line: #d7d0c4;
      --accent: #9cad97;
      --accent-soft: #dfe7dc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(156, 173, 151, 0.14), transparent 30%),
        radial-gradient(circle at bottom right, rgba(156, 173, 151, 0.10), transparent 25%),
        var(--bg);
    }

    .box {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    /* Logo mit Berufsbezeichnung; volle Breite am Handy, damit die
       Bezeichnung lesbar bleibt */
    .logo {
      width: min(300px, 100%);
      height: auto;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-family: Georgia, Gelasio, "Times New Roman", serif;
      font-size: 1.6rem;
      font-weight: 700;
      margin: 0 0 0.9rem;
    }

    p {
      margin: 0 0 0.6rem;
      line-height: 1.6;
      color: var(--muted);
    }

    .en {
      font-size: 0.95rem;
      margin-bottom: 2.2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.9rem 1.4rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.7);
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      line-height: 1.35;
      transition: 0.25s ease;
    }

    .btn:hover,
    .btn:focus-visible {
      background: var(--accent-soft);
      border-color: var(--accent);
      outline: none;
      transform: translateY(-2px);
    }

    .contact {
      margin-top: 2.5rem;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .contact a {
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
    }

    .contact a:hover,
    .contact a:focus-visible { color: var(--text); }

    @media (max-width: 640px) {
      h1 { font-size: 1.35rem; }
      .logo { margin-bottom: 2rem; }
    }
  </style>
</head>
<body>
  <main class="box">
    <a href="/"><img class="logo" src="/logo-header-titel-de.svg" alt="Christian Lacina, Psychotherapeut in Fachausbildung unter Lehrsupervision" /></a>

    <h1>Diese Seite gibt es nicht</h1>
    <p>Die aufgerufene Adresse führt ins Leere — vielleicht ein Tippfehler oder ein veralteter Link.</p>
    <p class="en">This page doesn’t exist. Please return to the homepage.</p>

    <a class="btn" href="/">Zur Startseite</a>

    <p class="contact">
      Sie erreichen mich auch direkt:
      <a href="tel:+436643845744">0664&nbsp;38&nbsp;45&nbsp;744</a>
      ·
      <a href="mailto:praxis@christian-lacina.at">praxis@christian-lacina.at</a>
    </p>
  </main>
</body>
</html>
